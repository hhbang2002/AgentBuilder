[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# DB URL은 migrations/env.py가 platform.adapters.settings.get_settings()에서 읽는다.
# (배포 프로파일 전환 시 alembic.ini를 건드리지 않기 위함 — 설계문서 §9.3)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
